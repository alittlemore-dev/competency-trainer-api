name: Update coverage badge

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish-coverage-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download coverage badge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: competency-trainer-coverage-badge-${{ github.sha }}
          path: .github/badges/

      - name: Commit changed badge
        run: |
          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "main has advanced; a newer run will update the badge."
            exit 0
          fi
          git add .github/badges/coverage-backend.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update competency-trainer coverage badge'
          git push origin HEAD:main
