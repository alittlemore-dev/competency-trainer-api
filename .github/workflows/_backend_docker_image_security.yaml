name: Backend Docker image security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-docker-image-security:
    name: Backend Docker image security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_EXPORT_PATH: competency-trainer-image.tar
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build, lint, and scan Docker image
        run: make security-docker-image
      - name: Upload checked image
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: competency-trainer-image-${{ github.sha }}
          path: competency-trainer-image.tar
          retention-days: 1
          compression-level: 0
